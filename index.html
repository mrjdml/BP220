<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BP 220 Reviewer — Economic & Socialized Housing</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --brick:#5e2c22;
  --brick-2:#733a2c;
  --wheat:#c9962e;
  --wheat-light:#e8c877;
  --forest:#33502f;
  --forest-light:#537a4c;
  --parchment:#f7f0da;
  --parchment-2:#eee0b8;
  --line:#ddc99a;
  --ink:#241d16;
  --ink-soft:#5c5240;
  --sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --serif:'Spectral', Georgia, 'Times New Roman', serif;
  --mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--brick);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--wheat-light); color:var(--brick);}

.app{ display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
@media (max-width:900px){ .app{grid-template-columns:1fr;} }

.sidebar{
  background:var(--brick); color:#e9ddd0; padding:28px 20px 24px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  border-right:1px solid rgba(232,200,119,0.18);
}
@media (max-width:900px){
  .sidebar{position:static; height:auto; border-right:none; border-bottom:1px solid rgba(232,200,119,0.18); padding:18px 16px;}
}
.crest{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
.crest-mark{
  width:44px;height:44px;flex:0 0 44px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, var(--wheat-light), var(--wheat) 55%, #8a611c 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif); font-weight:700; color:var(--brick); font-size:13px;
  box-shadow:0 0 0 3px rgba(232,200,119,0.15);
}
.crest-text .k1{font-family:var(--serif); font-size:19px; font-weight:600; color:#f7f0da; line-height:1.1;}
.crest-text .k2{font-size:11px; letter-spacing:.04em; color:#c2ac93; margin-top:2px;}

.nav-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:#a68f76; margin:20px 0 8px; font-weight:600; }
.nav-group-label:first-of-type{margin-top:4px;}
nav.tabs{display:flex; flex-direction:column; gap:2px;}
@media (max-width:900px){ nav.tabs{flex-direction:row; flex-wrap:wrap;} }
.tab-btn{
  all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:7px; font-size:13.5px; color:#d9c8b5;
  transition:background .15s ease, color .15s ease;
}
.tab-btn:hover{background:rgba(232,200,119,0.08); color:#f7f0da;}
.tab-btn.active{background:rgba(232,200,119,0.14); color:#f7f0da; font-weight:600;}
.tab-btn .dot{width:6px;height:6px;border-radius:50%;background:#7a5c47; flex:0 0 6px;}
.tab-btn.active .dot{background:var(--wheat-light);}

.side-foot{ margin-top:26px; padding-top:16px; border-top:1px solid rgba(232,200,119,0.15); font-size:11px; color:#a68f76; line-height:1.6; }

main.content{ background:var(--parchment); min-height:100vh; }
.topbar{
  position:sticky; top:0; z-index:20; background:var(--parchment); border-bottom:1px solid var(--line);
  padding:16px 32px; display:flex; gap:16px; align-items:center;
}
@media (max-width:640px){ .topbar{padding:12px 16px; flex-wrap:wrap;} }
.search-wrap{flex:1; position:relative; max-width:480px;}
.search-wrap input{
  width:100%; padding:10px 14px 10px 36px; border-radius:8px; border:1px solid var(--line);
  background:#fff; font-family:var(--sans); font-size:13.5px; color:var(--ink); outline:none;
}
.search-wrap input:focus{border-color:var(--wheat);}
.search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.45;}
.topbar-title{font-family:var(--serif); font-size:15px; color:var(--ink-soft); margin-left:auto; white-space:nowrap;}
@media (max-width:640px){ .topbar-title{display:none;} }

.view{padding:32px; max-width:940px; margin:0 auto;}
@media (max-width:640px){ .view{padding:20px 16px;} }
.view-header{margin-bottom:26px;}
.eyebrow-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.badge-pill{ font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; background:var(--brick); color:var(--wheat-light); padding:3px 9px; border-radius:20px; }
h1.view-title{font-family:var(--serif); font-size:32px; font-weight:600; margin:0 0 8px; color:var(--brick); line-height:1.15;}
p.view-sub{font-size:14.5px; color:var(--ink-soft); max-width:62ch; line-height:1.6; margin:0;}

.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:24px 0 30px;}
@media (max-width:700px){ .stat-row{grid-template-columns:repeat(2,1fr);} }
.stat-card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
.stat-card .n{font-family:var(--serif); font-size:24px; color:var(--forest); font-weight:600; line-height:1;}
.stat-card .l{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}

.home-timeline{border-left:2px solid var(--line); margin-left:8px; padding-left:22px; display:flex; flex-direction:column; gap:20px;}
.tl-item{position:relative;}
.tl-item::before{
  content:''; position:absolute; left:-28.5px; top:3px; width:11px; height:11px; border-radius:50%;
  background:var(--wheat); border:2px solid var(--parchment); box-shadow:0 0 0 2px var(--wheat);
}
.tl-date{font-family:var(--mono); font-size:12px; color:var(--forest); font-weight:600;}
.tl-title{font-family:var(--serif); font-size:16.5px; font-weight:600; color:var(--brick); margin:2px 0 3px;}
.tl-desc{font-size:13.5px; color:var(--ink-soft); line-height:1.55; max-width:64ch;}

.quicklinks{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:26px;}
@media (max-width:640px){ .quicklinks{grid-template-columns:1fr;} }
.qlink{ display:block; text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; cursor:pointer; transition:border-color .15s, transform .1s; }
.qlink:hover{border-color:var(--wheat);}
.qlink .qt{font-family:var(--serif); font-weight:600; color:var(--brick); font-size:15px;}
.qlink .qd{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}

.article-block{margin-bottom:34px;}
.article-heading{
  font-family:var(--serif); font-size:19px; font-weight:600; color:var(--brick);
  padding-bottom:8px; margin-bottom:14px; border-bottom:2px solid var(--wheat);
  display:flex; align-items:baseline; gap:10px;
}
.article-heading .tag{font-family:var(--mono); font-size:11px; color:var(--forest); font-weight:600;}

.sec-card{ background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
.sec-head{ all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; }
.sec-num{ font-family:var(--mono); font-size:12px; color:#fff; background:var(--brick); padding:3px 8px; border-radius:5px; flex:0 0 auto; white-space:nowrap; }
.sec-title{font-family:var(--serif); font-weight:600; font-size:15px; color:var(--ink); flex:1;}
.sec-chevron{transition:transform .2s ease; color:var(--ink-soft); flex:0 0 auto;}
.sec-card.open .sec-chevron{transform:rotate(180deg);}
.sec-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; padding:0 16px; }
.sec-card.open .sec-body{padding:0 16px 16px;}
.sec-body-inner{font-size:14px; line-height:1.65; color:var(--ink);}
.sec-body-inner p{margin:0 0 10px;}
.sec-body-inner ul{margin:0 0 10px; padding-left:20px;}
.sec-body-inner li{margin-bottom:5px;}
.kw{ background:linear-gradient(transparent 60%, var(--wheat-light) 60%); font-weight:600; }
.trap-box{ background:#eaf0e7; border-left:3px solid var(--forest); border-radius:6px; padding:10px 12px; font-size:13px; color:#20351d; margin-top:8px; display:flex; gap:8px; }
.trap-box .lbl{font-family:var(--mono); font-weight:700; font-size:10.5px; color:var(--forest); white-space:nowrap; padding-top:1px;}

.glossary-grid{display:grid; grid-template-columns:1fr; gap:10px;}
.g-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
.g-term{font-family:var(--serif); font-weight:700; color:var(--brick); font-size:15px;}
.g-abbr{font-family:var(--mono); font-size:11px; color:var(--forest); margin-left:6px;}
.g-def{font-size:13.5px; color:var(--ink-soft); margin-top:4px; line-height:1.55;}

.people-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media (max-width:640px){ .people-grid{grid-template-columns:1fr;} }
.p-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px;}
.p-name{font-family:var(--serif); font-weight:700; color:var(--brick); font-size:16px;}
.p-role{font-size:11.5px; color:var(--forest); font-weight:600; margin:2px 0 8px; text-transform:uppercase; letter-spacing:.03em;}
.p-desc{font-size:13px; color:var(--ink-soft); line-height:1.55;}

.trap-list{display:flex; flex-direction:column; gap:10px;}
.trap-item{ background:#fff; border:1px solid var(--line); border-left:4px solid var(--forest); border-radius:8px; padding:14px 16px; }
.trap-item .tnum{font-family:var(--mono); font-size:11px; color:var(--forest); font-weight:700;}
.trap-item .ttitle{font-family:var(--serif); font-weight:600; font-size:14.5px; color:var(--brick); margin:3px 0 4px;}
.trap-item .tbody{font-size:13.5px; color:var(--ink-soft); line-height:1.55;}

.quiz-box{background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px;}
.quiz-progress{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
.quiz-q{font-family:var(--serif); font-size:17px; font-weight:600; color:var(--brick); margin-bottom:16px; line-height:1.4;}
.quiz-opts{display:flex; flex-direction:column; gap:8px;}
.quiz-opt{
  all:unset; box-sizing:border-box; cursor:pointer; display:block; padding:11px 14px;
  border:1px solid var(--line); border-radius:8px; font-size:13.5px; transition:border-color .15s, background .15s;
}
.quiz-opt:hover{border-color:var(--wheat);}
.quiz-opt.correct{background:#eaf3ea; border-color:#4c6b52; color:#284a2c; font-weight:600;}
.quiz-opt.wrong{background:#f7e6e1; border-color:#a8452e; color:#5c2317; font-weight:600;}
.quiz-opt.disabled{pointer-events:none;}
.quiz-explain{ margin-top:14px; padding:12px 14px; background:var(--parchment-2); border-radius:8px; font-size:13px; color:var(--ink-soft); line-height:1.55; display:none; }
.quiz-explain.show{display:block;}
.quiz-nav{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
.btn{ all:unset; cursor:pointer; font-family:var(--sans); font-weight:600; font-size:13px; background:var(--brick); color:#f7f0da; padding:10px 18px; border-radius:7px; }
.btn:hover{background:var(--brick-2);}
.btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
.quiz-score{font-family:var(--serif); font-size:22px; color:var(--brick); text-align:center; padding:20px 0;}
.quiz-score .sub{font-family:var(--sans); font-size:13px; color:var(--ink-soft); font-weight:400; margin-top:6px;}

.hidden{display:none !important;}
.nores{padding:40px 0; text-align:center; color:var(--ink-soft); font-size:14px;}
</style>
</head>
<body><div class="app"><aside class="sidebar"><div class="crest"><div class="crest-mark">BP</div><div class="crest-text"><div class="k1">BP 220 Codex</div><div class="k2">Housing Standards · REB &amp; REA</div></div></div>
<div class="nav-group-label">Reviewer</div><nav class="tabs"><button class="tab-btn active" data-tab="home"><span class="dot"></span>Overview</button><button class="tab-btn" data-tab="history"><span class="dot"></span>History of the Law</button><button class="tab-btn" data-tab="irr"><span class="dot"></span>IRR Standards</button><button class="tab-btn" data-tab="related"><span class="dot"></span>Related Laws</button></nav>
<div class="nav-group-label">Study Aids</div><nav class="tabs"><button class="tab-btn" data-tab="dates"><span class="dot"></span>Important Dates</button><button class="tab-btn" data-tab="people"><span class="dot"></span>Important People</button><button class="tab-btn" data-tab="glossary"><span class="dot"></span>Glossary of Terms</button><button class="tab-btn" data-tab="traps"><span class="dot"></span>Board Exam Traps</button><button class="tab-btn" data-tab="quiz"><span class="dot"></span>Self-Test Quiz</button></nav>
<div class="side-foot">Verify current price ceilings and DHSUD issuances before the exam.</div></aside>
<main class="content"><div class="topbar"><div class="search-wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" type="text" placeholder="Search sections, terms, dates, traps…"></div><div class="topbar-title" id="topbarTitle">Overview</div></div><div class="view" id="viewRoot"></div></main></div>
<script>
const dates=[{"date": "1966", "title": "RA 4726 — Condominium Act", "desc": "Basis for condominium ownership; later cross-referenced by BP 220 condominium projects."}, {"date": "Aug 26, 1972", "title": "RA 6552 — Maceda Law", "desc": "Protects buyers of real estate on installment payments."}, {"date": "Jul 12, 1976", "title": "PD 957 signed", "desc": "Subdivision and Condominium Buyers' Protective Decree (Pres. Marcos) — regulates open-market subdivisions and condominiums; its standards are the baseline that BP 220 relaxes."}, {"date": "Feb 19, 1977", "title": "PD 1096 — National Building Code", "desc": "Building standards; BP 220 authorizes lower standards for economic and socialized housing."}, {"date": "1977", "title": "PD 1216 and PD 1185", "desc": "PD 1216 (open space in subdivisions) and PD 1185 (Fire Code, later replaced by RA 9514) — both listed as standards BP 220 may depart from."}, {"date": "Feb 7, 1981", "title": "EO 648 — Human Settlements Regulatory Commission (HSRC)", "desc": "Created the regulator that would first implement BP 220."}, {"date": "Mar 25, 1982", "title": "BP 220 approved", "desc": "'Prescribing standards and technical requirements for economic and socialized housing projects in urban and rural areas.' Approved by Pres. Ferdinand E. Marcos."}, {"date": "Dec 17, 1986", "title": "EO 90 — HLURB and HUDCC", "desc": "Pres. Aquino reorganizes housing agencies; the HSRC becomes the Housing and Land Use Regulatory Board (HLURB)."}, {"date": "Mar 24, 1992", "title": "RA 7279 — UDHA", "desc": "Urban Development and Housing Act; supplies the modern definition of socialized housing."}, {"date": "Nov 12, 2008", "title": "Revised IRR of BP 220 adopted", "desc": "HLURB revised rules and standards (Rules I to VI, Tables 1 to 11)."}, {"date": "Jan 28, 2009", "title": "HLURB Administrative Order No. 01, s. 2009", "desc": "Publication of the revised rules and standards."}, {"date": "Feb 14, 2019", "title": "RA 11201 — DHSUD", "desc": "Signed by Pres. Duterte; creates the Department of Human Settlements and Urban Development, absorbing the HLURB's regulatory functions."}];
const people=[{"name": "Pres. Ferdinand E. Marcos", "role": "Approved BP 220 (Mar 25, 1982)", "desc": "Also signed PD 957 (1976), PD 1096 and PD 1216 (1977) — the decree family BP 220 sits beside."}, {"name": "Imelda R. Marcos", "role": "Minister of Human Settlements", "desc": "Led the Ministry of Human Settlements, the umbrella under which the HSRC regulated housing at the time."}, {"name": "Batasang Pambansa", "role": "Enacting legislature", "desc": "BP 220 is a Batas Pambansa, enacted by the legislature of the period, not a Presidential Decree."}, {"name": "Pres. Corazon C. Aquino", "role": "EO 90 (1986) and RA 7279 (1992)", "desc": "Reorganized the housing agencies (HLURB, HUDCC) and approved the UDHA."}, {"name": "Pres. Rodrigo R. Duterte", "role": "Approved RA 11201 (Feb 14, 2019)", "desc": "Created DHSUD; HLURB functions transferred."}, {"name": "DHSUD", "role": "Current regulator", "desc": "Successor to HLURB for regulation and standards; adjudication passed to the Human Settlements Adjudication Commission (HSAC)."}, {"name": "HLURB", "role": "Issued the 2008 Revised IRR", "desc": "Formerly HSRC; issued the operative Revised Rules and Standards under BP 220."}, {"name": "Developers, LGUs, Brokers and Appraisers", "role": "Regulated persons", "desc": "Developers must follow standards and get plan approvals; brokers must verify project registration; appraisers must know which standard applies to a subdivision."}];
const glossary=[{"term": "Economic housing", "abbr": "BP 220", "def": "Housing for low-income earners built under lower standards than PD 957 open-market housing."}, {"term": "Socialized housing", "abbr": "RA 7279 / BP 220", "def": "Housing for the underprivileged and homeless; the lowest standards and price ceilings."}, {"term": "Single detached", "abbr": "", "def": "A dwelling standing alone on its own lot (72 sq m economic; 64 sq m socialized)."}, {"term": "Duplex / single attached", "abbr": "", "def": "Two units sharing a party wall on separate lots (54 / 48 sq m)."}, {"term": "Row house", "abbr": "", "def": "Three or more attached units separated by party walls (36 / 28 sq m); max 20 units per block, 100 m length."}, {"term": "Saleable / non-saleable area", "abbr": "", "def": "Non-saleable areas include roads, community facilities and parks and playgrounds."}, {"term": "Gross area", "abbr": "", "def": "Total project area used to compute the parks and playground allocation."}, {"term": "HSRC / HLURB / DHSUD", "abbr": "", "def": "The regulator's lineage: 1981, 1986, 2019."}, {"term": "HSAC", "abbr": "Human Settlements Adjudication Commission", "def": "Adjudicates housing disputes since RA 11201."}, {"term": "Variance", "abbr": "Sec. 7", "def": "Permitted deviation from the standards for specific regional or economic settings."}];
const historyArticles=[{"heading": "Why BP 220 Exists", "tag": "1970s to 1982", "sections": [{"num": "The problem", "title": "PD 957 standards were too costly for low-income housing", "body": "<p>PD 957 (1976) set uniform design standards for open-market subdivisions and condominiums. Compliance raised costs, pricing out low-income families. The government wanted private developers to build affordable units.</p>"}, {"num": "The solution", "title": "Two levels of lower standards", "body": "<p>BP 220 (Mar 25, 1982) authorized the regulator to set <span class='kw'>two levels of standards</span> — economic and socialized housing — lower than those under PD 957, PD 1216, PD 1096 and PD 1185, so private developers can supply low-cost housing.</p>"}]}, {"heading": "Evolution of the Implementing Body", "tag": "1981 to 2019", "sections": [{"num": "Ministry Order No. 39", "title": "The ORIGINAL IRR of BP 220 (1982)", "body": "<p>BP 220 Sec. 3 authorized the <span class='kw'>Ministry of Human Settlements</span> to issue the actual design standards. It did so via <span class='kw'>Ministry Order No. 39, s. 1982</span> — 'Rules and Standards for Economic and Socialized Housing Projects to Implement BP 220' (published as Annex A to the law itself). This is the FIRST-generation IRR — not a separate law from BP 220, but its implementing rules.</p><div class='trap-box'><span class='lbl'>TRAP</span><span>Ministry Order No. 39 is not a distinct statute — it IS the BP 220 IRR, issued under Sec. 3 of BP 220. Older reviewers cite it by name; current ones cite the 2008 Revised IRR instead. Both are 'the IRR of BP 220,' just different generations.</span></div>"}, {"num": "HSRC", "title": "Human Settlements Regulatory Commission (1981)", "body": "<p>Created by EO 648 (1981) under the Ministry of Human Settlements; first implementer of BP 220.</p>"}, {"num": "HLURB", "title": "Housing and Land Use Regulatory Board (1986)", "body": "<p>EO 90 (Dec 17, 1986) reorganized the housing agencies. The HLURB later REPLACED Ministry Order No. 39 with the 2008 Revised IRR (adopted Nov 12, 2008; published via AO 01, s. 2009) — updating the lot-area and design tables to current figures.</p><div class='trap-box'><span class='lbl'>TRAP</span><span>If a question asks for the CURRENT lot-area/frontage numbers, use the 2008 Revised IRR figures (in the IRR Standards tab), not any older Ministry Order No. 39 figures your notes might still carry.</span></div>"}, {"num": "DHSUD", "title": "Department of Human Settlements and Urban Development (2019)", "body": "<p>RA 11201 (Feb 14, 2019) consolidated housing agencies into the DHSUD; HLURB's regulatory functions moved there, adjudication to the <span class='kw'>Human Settlements Adjudication Commission</span>.</p><div class='trap-box'><span class='lbl'>TRAP</span><span>HLURB no longer regulates; DHSUD does. Use 'DHSUD' in current-answer questions.</span></div>"}]}, {"heading": "Later Housing Policy", "tag": "1992 onward", "sections": [{"num": "RA 7279", "title": "Urban Development and Housing Act (1992)", "body": "<p>Institutionalized socialized housing and land-use tools for the urban poor; its definition of socialized housing is now the standard reference.</p>"}, {"num": "Price ceilings", "title": "Original 1982 ceilings have been superseded", "body": "<p>In 1982, socialized housing was pegged at ₱150,000 and below; economic housing ₱150,000 to ₱375,000. These ceilings have since been raised by housing authorities. Use the currently prescribed ceilings when a question gives a year.</p>"}]}];
const irrArticles=[{"heading": "Scope and Policy", "tag": "Rule I", "sections": [{"num": "Sec. 1", "title": "Applies to economic and socialized housing projects", "body": "<p>Applies in urban and rural areas, to development of either a <span class='kw'>house and lot or a house or lot only</span>.</p>"}, {"num": "Sec. 2", "title": "Declaration of policy", "body": "<p>Promote development of economic and socialized housing by the <span class='kw'>private sector</span> for average and low-income earners in urban and rural areas.</p>"}, {"num": "Sec. 3 (BP 220)", "title": "Two levels of standards", "body": "<p>The regulator may set standards and technical requirements different from PD 957, PD 1216, PD 1096 and PD 1185.</p>"}]}, {"heading": "Minimum Design Standards (2008 Revised IRR)", "tag": "Rule II", "sections": [{"num": "Table 7", "title": "Minimum lot area", "body": "<table style='width:100%;border-collapse:collapse'><tr><th>Type</th><th>Economic</th><th>Socialized</th></tr><tr><td>Single detached</td><td>72 sq m</td><td>64 sq m</td></tr><tr><td>Duplex / single attached</td><td>54 sq m</td><td>48 sq m</td></tr><tr><td>Row house</td><td>36 sq m</td><td>28 sq m</td></tr></table><div class='trap-box'><span class='lbl'>TRAP</span><span>Socialized is always smaller than economic. Contrast with PD 957 open market: 120 / 96 / 60 sq m.</span></div>"}, {"num": "Table 8", "title": "Minimum lot frontage", "body": "<ul><li>Single detached: <span class='kw'>8 m</span> (corner and regular), 4 m irregular, 3 m interior.</li><li>Duplex/single attached: 6 m.</li><li>Row house: <span class='kw'>4 m economic / 3.5 m socialized</span>.</li><li>Row houses: maximum <span class='kw'>20 units per block</span>, and not more than <span class='kw'>100 m</span> in length.</li></ul>"}, {"num": "Lot pricing", "title": "Cap on lot price", "body": "<p>The price of a saleable single-detached lot shall not exceed <span class='kw'>40%</span> of the maximum selling price of the house and lot package. Duplex and row house lots must come with housing components.</p>"}, {"num": "Parks", "title": "Parks and playgrounds", "body": "<p>Mandatory for projects <span class='kw'>1 hectare or above</span>; non-alienable, non-buildable for community hall (buildable for basketball court). Allocation is <span class='kw'>3.5% of gross area</span> at densities of 150 lots/DUs per hectare and below, rising with density.</p>"}, {"num": "Setbacks", "title": "Yards (Table 9)", "body": "<p>Front setback 1.5 m; rear yard 2.0 m; side yard 1.5 m from the building line. Verify by housing type in the current rules.</p>"}, {"num": "Condominium", "title": "BP 220 condominium projects", "body": "<p>Minimum unit floor area is <span class='kw'>18 sq m</span> for BP 220 condominium projects.</p>"}]}, {"heading": "Approvals and Variances", "tag": "Rules III to VI", "sections": [{"num": "Rule III", "title": "Approval of subdivision plans and building designs", "body": "<p>Approval is required before development; the regulator also handles registration of projects and approvals of housing designs.</p>"}, {"num": "Sec. 7", "title": "Variances and exemptions", "body": "<p>Variations are allowed for regional, cultural and economic settings within minimum health, safety and ecological levels.</p>"}, {"num": "Donation", "title": "Roads, open spaces and water supply", "body": "<p>Roads, open spaces and water supply facilities are donated to the LGU or appropriate agency as required (final sections of the Revised IRR).</p>"}]}];
const relatedArticles=[{"heading": "Housing Regulation Family", "tag": "Standards and buyer protection", "sections": [{"num": "PD 957", "title": "Subdivision and Condominium Buyers' Protective Decree (1976)", "body": "<p>Regulates open-market and medium-cost subdivisions; higher standards (open-market minimum lot 120 sq m). <span class='kw'>BP 220 is the lower-standard track</span> for economic and socialized housing.</p>"}, {"num": "PD 1216", "title": "Open Space in Subdivisions (1977)", "body": "<p>Requires open space allocation; BP 220 allows a different level for economic and socialized housing.</p>"}, {"num": "PD 1096 and PD 1185 / RA 9514", "title": "National Building Code and Fire Code", "body": "<p>General building and fire standards that BP 220 may relax; the Fire Code was later replaced by RA 9514 (2008).</p>"}, {"num": "RA 4726", "title": "Condominium Act", "body": "<p>Basis of condominium ownership; BP 220 sets a minimum floor area for BP 220 condominium units.</p>"}, {"num": "RA 6552", "title": "Maceda Law (1972)", "body": "<p>Protects installment buyers of residential real estate, including buyers of economic and socialized units.</p>"}]}, {"heading": "Socialized Housing and Finance", "tag": "Policy and financing", "sections": [{"num": "RA 7279", "title": "Urban Development and Housing Act (1992)", "body": "<p>Defines socialized housing and prescribes urban land-use and housing tools.</p>"}, {"num": "RA 7835", "title": "CISFA (1994)", "body": "<p>Comprehensive and Integrated Shelter Financing Act; supports financing of socialized housing.</p>"}, {"num": "RA 11201", "title": "DHSUD Act (2019)", "body": "<p>Current regulator; supersedes HLURB and HUDCC.</p>"}, {"num": "RA 9646", "title": "RESA Law (2009)", "body": "<p>Professional law for brokers and appraisers who deal with BP 220 projects.</p>"}]}];
const traps=[{"t": "BP 220 is a Presidential Decree", "b": "False. It is a Batas Pambansa (1982). PD 957, PD 1216 and PD 1096 are decrees."}, {"t": "Economic lots are smaller than socialized lots", "b": "False. Economic: 72 / 54 / 36. Socialized: 64 / 48 / 28. Socialized is smaller."}, {"t": "BP 220 applies to all subdivisions", "b": "False. Only economic and socialized housing. Open-market and medium-cost projects follow PD 957 standards."}, {"t": "HLURB regulates BP 220 today", "b": "Outdated. DHSUD (RA 11201, Feb 14, 2019) is the current regulator; HSAC handles adjudication."}, {"t": "The 1982 price ceilings are still current", "b": "Outdated. Original ceilings (socialized up to ₱150,000; economic ₱150,000 to ₱375,000) have been raised; check the given year."}, {"t": "The lot may cost any share of the package", "b": "False. Single-detached lot price may not exceed 40% of the house and lot package maximum price."}, {"t": "Parks and playgrounds are required for every project", "b": "False. Mandatory for projects 1 hectare or above."}, {"t": "Row houses may run indefinitely", "b": "False. Max 20 units per block and not more than 100 m in length."}, {"t": "Row house frontage is the same for both", "b": "False. 4 m economic vs. 3.5 m socialized."}, {"t": "The 2008 Revised IRR and the original 1982 rules are equally current", "b": "The 2008 Revised IRR (adopted Nov 12, 2008; AO 01 s. 2009) is the operative one."}, {"t": "BP 220 removes buyer protection", "b": "BP 220 lowers design standards, not the developer's obligations to buyers; PD 957 protections and the Maceda Law remain relevant."}];
const quiz=[{"q": "BP 220 was approved on:", "opts": ["Jul 12, 1976", "Mar 25, 1982", "Mar 24, 1992", "Feb 14, 2019"], "a": 1, "ex": "BP 220 was approved on March 25, 1982."}, {"q": "Minimum lot area for single detached, economic housing:", "opts": ["64 sq m", "72 sq m", "80 sq m", "100 sq m"], "a": 1, "ex": "Economic 72 sq m; socialized 64 sq m."}, {"q": "Minimum row house lot area for socialized housing:", "opts": ["28 sq m", "36 sq m", "48 sq m", "54 sq m"], "a": 0, "ex": "Socialized row house: 28 sq m."}, {"q": "Which agency now regulates BP 220 standards?", "opts": ["HSRC", "HLURB", "DHSUD", "HUDCC"], "a": 2, "ex": "RA 11201 (2019) created DHSUD."}, {"q": "Parks and playgrounds are mandatory for projects of at least:", "opts": ["0.5 ha", "1 ha", "2 ha", "5 ha"], "a": 1, "ex": "Mandatory for 1 hectare or above."}, {"q": "A lot for a single-detached unit may cost at most what share of the house and lot package price?", "opts": ["30%", "40%", "50%", "60%"], "a": 1, "ex": "Not more than 40%."}, {"q": "Maximum number of row houses per block/cluster:", "opts": ["10", "15", "20", "30"], "a": 2, "ex": "20 units per block, and not more than 100 m."}, {"q": "Which decree sets the higher (open-market) standards that BP 220 relaxes?", "opts": ["PD 957", "RA 7279", "RA 6552", "RA 4726"], "a": 0, "ex": "PD 957 (Jul 12, 1976)."}, {"q": "Row house minimum lot frontage for socialized housing:", "opts": ["3 m", "3.5 m", "4 m", "6 m"], "a": 1, "ex": "4 m economic; 3.5 m socialized."}, {"q": "The operative Revised IRR of BP 220 was adopted on:", "opts": ["Mar 25, 1982", "Nov 12, 2008", "Jan 1, 2019", "Dec 17, 1986"], "a": 1, "ex": "November 12, 2008 (HLURB AO 01, s. 2009)."}];
const viewRoot=document.getElementById('viewRoot');const topbarTitle=document.getElementById('topbarTitle');let currentTab='home';let quizIdx=0,quizScore=0,quizAnswered=false;
function accordionHTML(articles){
  return articles.map((art) => `
    <div class="article-block">
      <div class="article-heading"><span>${art.heading}</span><span class="tag">${art.tag}</span></div>
      ${art.sections.map((s) => `
        <div class="sec-card" data-search="${(s.title+' '+s.num+' '+s.body+(s.trap||'')).toLowerCase().replace(/"/g,'&quot;')}">
          <button class="sec-head" onclick="toggleSec(this)">
            <span class="sec-num">${s.num}</span>
            <span class="sec-title">${s.title}</span>
            <svg class="sec-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sec-body"><div class="sec-body-inner">
            ${s.body}
            ${s.trap ? `<div class="trap-box"><span class="lbl">TRAP</span><span>${s.trap}</span></div>` : ''}
          </div></div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function toggleSec(btn){
  const card = btn.closest('.sec-card');
  const body = card.querySelector('.sec-body');
  const isOpen = card.classList.contains('open');
  if(isOpen){
    card.classList.remove('open');
    body.style.maxHeight = null;
  } else {
    card.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 40 + 'px';
  }
}

function renderHome(){topbarTitle.textContent='Overview';viewRoot.innerHTML=`
<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">Housing Law</span></div><h1 class="view-title">BP 220 and its IRR</h1>
<p class="view-sub">Batas Pambansa Blg. 220: minimum design standards and technical requirements for economic and socialized housing projects in urban and rural areas. Relevant to REB Special and Technical and REA Land Management.</p></div>
<div class="stat-row"><div class="stat-card"><div class="n">1982</div><div class="l">Approved Mar 25, 1982</div></div><div class="stat-card"><div class="n">72 / 64</div><div class="l">Single-detached min lot (sq m): economic / socialized</div></div><div class="stat-card"><div class="n">3.5%</div><div class="l">Parks and playgrounds at 150 lots/ha and below</div></div><div class="stat-card"><div class="n">DHSUD</div><div class="l">Current regulator (RA 11201, 2019)</div></div></div>
<div class="quicklinks"><div class="qlink" onclick="switchTab('history')"><div class="qt">History of the Law →</div><div class="qd">Why BP 220 exists; HSRC to HLURB to DHSUD.</div></div><div class="qlink" onclick="switchTab('irr')"><div class="qt">IRR Standards →</div><div class="qd">Lot areas, frontages, parks, setbacks.</div></div><div class="qlink" onclick="switchTab('related')"><div class="qt">Related Laws →</div><div class="qd">PD 957, PD 1216, PD 1096, RA 7279, RA 11201.</div></div><div class="qlink" onclick="switchTab('dates')"><div class="qt">Important Dates →</div><div class="qd">Timeline from 1966 to 2019.</div></div></div>`;}
function renderDates(){topbarTitle.textContent='Important Dates';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">When</span></div><h1 class="view-title">Important Dates</h1><p class="view-sub">Chronology of BP 220 and the laws around it.</p></div><div class="home-timeline">${dates.map(t=>`<div class="tl-item" data-search="${(t.date+' '+t.title+' '+t.desc).toLowerCase().replace(/"/g,'&quot;')}"><div class="tl-date">${t.date}</div><div class="tl-title">${t.title}</div><div class="tl-desc">${t.desc}</div></div>`).join('')}</div>`;}
function renderPeople(){topbarTitle.textContent='Important People';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">Who</span></div><h1 class="view-title">Important People and Institutions</h1><p class="view-sub">Presidents, agencies and stakeholders tied to BP 220.</p></div><div class="people-grid">${people.map(p=>`<div class="p-card" data-search="${(p.name+' '+p.role+' '+p.desc).toLowerCase().replace(/"/g,'&quot;')}"><div class="p-name">${p.name}</div><div class="p-role">${p.role}</div><div class="p-desc">${p.desc}</div></div>`).join('')}</div>`;}
function renderHistory(){topbarTitle.textContent='History of the Law';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">1976 to 2019</span></div><h1 class="view-title">History of BP 220</h1><p class="view-sub">Why the law was enacted and how its implementing body evolved.</p></div><div id="historySections">${accordionHTML(historyArticles)}</div>`;}
function renderIrr(){topbarTitle.textContent='IRR Standards';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">2008 Revised IRR</span></div><h1 class="view-title">BP 220 Implementing Rules and Standards</h1><p class="view-sub">The operative numbers examiners ask about.</p></div><div id="irrSections">${accordionHTML(irrArticles)}</div>`;}
function renderRelated(){topbarTitle.textContent='Related Laws';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">Distinctions</span></div><h1 class="view-title">Related Laws</h1><p class="view-sub">PD 957, PD 1216, PD 1096, RA 7279, RA 11201 and more.</p></div><div id="relatedSections">${accordionHTML(relatedArticles)}</div>`;}
function renderGlossary(){
  topbarTitle.textContent = 'Glossary';
  viewRoot.innerHTML = `
    <div class="view-header">
      <div class="eyebrow-row"><span class="badge-pill">Terms</span></div>
      <h1 class="view-title">Glossary of Terms</h1>
      <p class="view-sub">Housing, design-standard and agency terms in one place.</p>
    </div>
    <div class="glossary-grid">
      ${glossary.map(g => `
        <div class="g-card" data-search="${(g.term+' '+g.abbr+' '+g.def).toLowerCase().replace(/"/g,'&quot;')}">
          <span class="g-term">${g.term}</span><span class="g-abbr">${g.abbr}</span>
          <div class="g-def">${g.def}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTraps(){
  topbarTitle.textContent = 'Board Exam Traps';
  viewRoot.innerHTML = `
    <div class="view-header">
      <div class="eyebrow-row"><span class="badge-pill">Standards, agencies and price-ceiling gotchas</span></div>
      <h1 class="view-title">Board Exam Traps</h1>
      <p class="view-sub">Economic vs. socialized numbers, BP 220 vs. PD 957, and agencies that no longer exist.</p>
    </div>
    <div class="trap-list">
      ${traps.map((t,i) => `
        <div class="trap-item" data-search="${(t.t+' '+t.b).toLowerCase().replace(/"/g,'&quot;')}">
          <div class="tnum">TRAP ${i+1}</div>
          <div class="ttitle">${t.t}</div>
          <div class="tbody">${t.b}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderQuiz(reset){
  topbarTitle.textContent = 'Self-Test Quiz';
  if(reset){ quizIdx = 0; quizScore = 0; }
  quizAnswered = false;

  if(quizIdx >= quiz.length){
    viewRoot.innerHTML = `
      <div class="view-header">
        <div class="eyebrow-row"><span class="badge-pill">Results</span></div>
        <h1 class="view-title">Quiz Complete</h1>
      </div>
      <div class="quiz-box">
        <div class="quiz-score">${quizScore} / ${quiz.length} correct
          <div class="sub">${quizScore === quiz.length ? "Perfect score — ready for the board." : quizScore/quiz.length >= 0.7 ? "Solid — review the misses below and go again." : "Keep drilling the lot-area tables and dates, then retake."}</div>
        </div>
        <div class="quiz-nav" style="justify-content:center;">
          <button class="btn" onclick="renderQuiz(true)">Retake Quiz</button>
        </div>
      </div>
    `;
    return;
  }

  const item = quiz[quizIdx];
  viewRoot.innerHTML = `
    <div class="view-header">
      <div class="eyebrow-row"><span class="badge-pill">Self-Test</span></div>
      <h1 class="view-title">BP 220 Quiz</h1>
      <p class="view-sub">Questions on BP 220, its 2008 Revised IRR, and related housing laws.</p>
    </div>
    <div class="quiz-box">
      <div class="quiz-progress">Question ${quizIdx+1} of ${quiz.length} &nbsp;·&nbsp; Score so far: ${quizScore}</div>
      <div class="quiz-q">${item.q}</div>
      <div class="quiz-opts">
        ${item.opts.map((o,i) => `<button class="quiz-opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}
      </div>
      <div class="quiz-explain" id="quizExplain">${item.ex}</div>
      <div class="quiz-nav">
        <button class="btn ghost" onclick="renderQuiz(true)">Restart</button>
        <button class="btn" id="quizNextBtn" style="opacity:.4; pointer-events:none;" onclick="nextQuiz()">Next →</button>
      </div>
    </div>
  `;
}

function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered = true;
  const item = quiz[quizIdx];
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach((btn, idx) => {
    btn.classList.add('disabled');
    if(idx === item.a) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('wrong');
  });
  if(i === item.a) quizScore++;
  document.getElementById('quizExplain').classList.add('show');
  const nb = document.getElementById('quizNextBtn');
  nb.style.opacity = 1;
  nb.style.pointerEvents = 'auto';
}

function nextQuiz(){
  quizIdx++;
  renderQuiz(false);
}

/* ============================================================
   TAB SWITCHING + SEARCH
   ============================================================ */
const renderers = {
  home: renderHome, history: renderHistory, irr: renderIrr, related: renderRelated,
  dates: renderDates, people: renderPeople, glossary: renderGlossary, traps: renderTraps,
  quiz: () => renderQuiz(true)
};

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('searchInput').value = '';
  renderers[tab]();
  window.scrollTo(0,0);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const searchable = document.querySelectorAll('[data-search]');
  if(!q){
    searchable.forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.article-block, .article-heading').forEach(el => el.classList.remove('hidden'));
    const nores = document.getElementById('noResults');
    if(nores) nores.remove();
    return;
  }
  let anyVisible = false;
  searchable.forEach(el => {
    const match = el.dataset.search.includes(q);
    el.classList.toggle('hidden', !match);
    if(match) anyVisible = true;
    if(match && el.classList.contains('sec-card')){
      el.classList.add('open');
      const body = el.querySelector('.sec-body');
      if(body) body.style.maxHeight = body.scrollHeight + 40 + 'px';
    }
  });
  let nores = document.getElementById('noResults');
  if(!anyVisible){
    if(!nores){
      nores = document.createElement('div');
      nores.id = 'noResults';
      nores.className = 'nores';
      nores.textContent = 'No matches in this section. Try another tab.';
      viewRoot.appendChild(nores);
    }
  } else if(nores){
    nores.remove();
  }
});

/* init */
renderHome();
</script>
</body>
</html>
